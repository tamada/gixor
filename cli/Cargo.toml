[package]
name = "gixor-cli"
description = "Git Ignore indeX ORganizer, a command to manage .gitignore files."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
categories = ["command-line-utilities", "development-tools"]
keywords = [
    "cli",
    "gitignore",
    "gitignore-generator",
    "git",
    "shell",
]

[dependencies]
gixor.workspace = true

clap.workspace = true
clap_complete.workspace = true
env_logger.workspace = true
log.workspace = true
opener.workspace = true
terminal_size.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The package is gixor-cli so that the library keeps the gixor name on crates.io, but the command
# it installs stays gixor.
[[bin]]
name = "gixor"
path = "src/main.rs"
