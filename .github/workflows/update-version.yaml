name: update_version

on:
  push:
    branches:
      - release/v*

jobs:
  version-up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get tag
        id: vars
        run: |
          echo "GITHUB_REF: $GITHUB_REF"
          echo "tag=${GITHUB_REF##*/v}" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Update version
        run: |
          # Two lines of the workspace manifest carry the version and have to move together:
          # [workspace.package] sets it for both crates, and [workspace.dependencies] pins the
          # version gixor-cli asks of gixor. Leave the second behind and the published command
          # would depend on the previous release of the library.
          sed -E \
            -e "s/^version = \".*\"/version = \"${{ steps.vars.outputs.tag }}\"/" \
            -e "s/^(gixor = \{ path = \"lib\", version = )\"[^\"]*\"/\1\"${{ steps.vars.outputs.tag }}\"/" \
            Cargo.toml > a ; mv a Cargo.toml
          sed "s/\$VERSION/${{ steps.vars.outputs.tag }}/g" .templates/README.md > README.md
          sed "s/\$VERSION/${{ steps.vars.outputs.tag }}/g" .templates/template.md > docs/content/_index.md
          sed "s/ARG VERSION=.*/ARG VERSION=${{ steps.vars.outputs.tag }}/g" Containerfile > a ; mv a Containerfile

      - name: Initialize Git
        shell: bash
        run: |
          git config --global user.name  "GitHub Actions"
          git config --global user.email "action@github.com"
          auth_header="$(git config --local --get http.https://github.com/.extraheader)"

      - name: Commit the changes
        run:  |
          git commit -a -m "update version to ${{ steps.vars.outputs.tag }}, ready to publish v${{ steps.vars.outputs.tag }}" || true

      - name: Push branch
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.vars.outputs.branch }}
