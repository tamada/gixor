name: publish_site_release_assets
on:
  pull_request:
    branches:
      - main
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: "the version to publish, such as 3.0.0"
        required: true
        type: string

jobs:
  setup:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'release/v') && github.event.pull_request.merged == true)
    uses: tamada/.github/.github/workflows/release-start.yaml@v1
    with:
      # Empty on the pull request; the version comes from the head branch then.
      version: ${{ inputs.version }}
    permissions:
      contents: write

  # setup:
  #   runs-on: ubuntu-latest
  #   # ブランチ名が release/v から始まる場合のみに実行する．
  #   # プルリクエストがマージされた場合のみに実行する．
  #   if: startsWith(github.head_ref, 'release/v') && github.event.pull_request.merged == true
  #   outputs:
  #     appname: gixor
  #     tag: ${{ steps.vars.outputs.tag }}
  #   steps:
  #     - name: Git Tag name
  #       id: vars
  #       run: |
  #         echo "GITHUB_HEAD_REF: $GITHUB_HEAD_REF (${GITHUB_HEAD_REF##*/v})"
  #         echo "tag=${GITHUB_HEAD_REF##*/v}" >> $GITHUB_OUTPUT

  #     - name: Create release
  #       id: create_release
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  #       run: |
  #         gh release create v${{ steps.vars.outputs.tag }} \
  #           --draft \
  #           --repo  $GITHUB_REPOSITORY \
  #           --title "Release v${{ steps.vars.outputs.tag }}" \
  #           --generate-notes

  publish:
    runs-on: ${{ matrix.os }}
    needs: setup
    outputs:
      appname: ${{ needs.setup.outputs.appname }}
      tag: ${{ needs.setup.outputs.tag }}
      version: ${{ needs.setup.outputs.version }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: ${{ needs.setup.outputs.appname }}
            asset_name: ${{ needs.setup.outputs.appname }}-${{ needs.setup.outputs.version }}_linux_arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ${{ needs.setup.outputs.appname }}
            asset_name: ${{ needs.setup.outputs.appname }}-${{ needs.setup.outputs.version }}_linux_amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ${{ needs.setup.outputs.appname }}
            asset_name: ${{ needs.setup.outputs.appname }}-${{ needs.setup.outputs.version }}_darwin_arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ${{ needs.setup.outputs.appname }}
            asset_name: ${{ needs.setup.outputs.appname }}-${{ needs.setup.outputs.version }}_darwin_amd64

    steps:
      # initialization
      - name: Checkout the project
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod

      - name: Setup variables
        id: vars
        shell: bash
        run: |
          DIR=$(echo "${{ needs.setup.outputs.appname }}-${{ needs.setup.outputs.version }}")
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Setup Rust
        run: rustup update stable
      
      # No openssl to set up: gix is pure Rust and speaks TLS through rustls.
      - name: Setup for Linux
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release -p gixor-cli --target ${{ matrix.target }}

      # publish release
      - name: Create release file
        shell: bash
        run: |
          DIR=${{ steps.vars.outputs.dir }}
          DIST=${{ matrix.target }}
          mkdir -p dist/$DIST/$DIR
          cp -r README.md LICENSE assets dist/$DIST/$DIR
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/$DIST/$DIR/
          tar cvfz dist/${{ matrix.asset_name }}.tar.gz -C dist/$DIST $DIR

      - name: Upload the asset to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: 
          gh release upload "${{ needs.setup.outputs.tag }}" "dist/${{ matrix.asset_name }}.tar.gz" --clobber
        
  docker:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ACCOUNT }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: quay.io/tama5/${{ needs.publish.outputs.appname }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,suffix=,format=short
            type=raw,value=${{ needs.publish.outputs.version }}

      - name: Checkout the project
        uses: actions/checkout@v6

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish_to_crates_io:
    needs: [setup, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the trusted publishing of crates.io uses OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Rust
        run: rustup update stable
      
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish -p gixor
          cargo publish -p gixor-cli

  finish:
    needs: [setup, publish]
    uses: tamada/.github/.github/workflows/release-finish.yaml@v1
    with:
      tag: ${{ needs.setup.outputs.tag }}
    permissions:
      contents: write
    secrets: inherit

  # finalize_release:
  #   needs: publish
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: write
  #   steps:
  #     - name: Publish the release
  #       id: publish_release
  #       run:
  #         gh release edit --draft=false --repo $GITHUB_REPOSITORY v${{ needs.publish.outputs.tag }}
  #       env:
  #         GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
