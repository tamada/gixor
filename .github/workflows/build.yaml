name: build_products
on:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
          - windows-11-arm
    steps:
      # No openssl to set up on any platform: gix is pure Rust and speaks TLS through rustls.

      - name: Checkout project
        uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - uses: extractions/setup-just@v2

      - name: Verify formatting
        run:
          just verify_format

      - name: Build and calculate coverages
        run:
          just test

      # The browser bindings are built for a target of their own and from a workspace of their
      # own, so `just test` does not reach them.
      - name: Check the browser bindings
        if: matrix.os == 'ubuntu-latest'
        run:
          just wasm_check

      # The coverage file (coverage.lcov) is generated by cargo test
      # which is defined in Makefile.toml
      - name: Send Coverage to Coveralls
        uses: coverallsapp/github-action@master
        if: matrix.os == 'ubuntu-latest'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: target/coverage.lcov
