name: build_products
on:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # see every platform's result, rather than cancelling the rest on the first failure
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
          - windows-11-arm
    steps:
      # No openssl to set up on any platform: gix is pure Rust and speaks TLS through rustls.

      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup Rust
        run: |
              rustup update stable
              rustup default stable
              rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        run:  cargo install --locked cargo-llvm-cov

      # extractions/setup-just has no build for Windows on arm64; install-action has.
      - name: Install just
        uses: taiki-e/install-action@just

      - name: Verify formatting
        run:
          just verify_format

      # Only ubuntu reports the coverage, so the other platforms just build and test.
      - name: Build and calculate coverages
        if: matrix.os == 'ubuntu-latest'
        run:
          just test

      - name: Build and test
        if: matrix.os != 'ubuntu-latest'
        run:
          just test_without_coverage

      # The browser bindings are built for a target of their own and from a workspace of their
      # own, so `just test` does not reach them.
      - name: Check the browser bindings
        if: matrix.os == 'ubuntu-latest'
        run:
          just wasm_check

      # The coverage file (coverage.lcov) is generated by cargo test
      # which is defined in Makefile.toml
      - name: Send Coverage to Coveralls
        uses: coverallsapp/github-action@master
        if: matrix.os == 'ubuntu-latest'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: target/coverage.lcov
