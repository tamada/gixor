name: Copilot Setup Steps

on:
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Rust
        run: |
              rustup update stable

      - name: Setup Check
        run: |
          echo "Copilot setup steps completed."
